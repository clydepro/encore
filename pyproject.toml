[project]
name = "encore"
version = "0.1.0"
description = "Headless music jukebox appliance for the local network."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Encore Contributors" }]
keywords = ["jukebox", "music", "raspberry-pi", "mpv", "htmx", "sse", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Typing :: Typed",
]

# Runtime stack, declared up front from SAPRS Chapter 3 (3.1 Required Stack).
# No application code imports these yet; the bootstrap phase pins them so that
# dependency resolution is reproducible from the first feature commit onward.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mutagen>=1.47",
    "pillow>=10.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0,<3.0",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
# The Builder is a command you run to completion, not a service (ADR-001). The
# Server's entry point lands with its own milestone.
encore-builder = "apps.builder.main:main"

[project.urls]
Homepage = "https://github.com/clydepro/encore"
Documentation = "https://github.com/clydepro/encore/tree/main/docs"
Repository = "https://github.com/clydepro/encore"
Issues = "https://github.com/clydepro/encore/issues"
Changelog = "https://github.com/clydepro/encore/blob/main/CHANGELOG.md"

[dependency-groups]
# Development-only tooling (PBK Chapter 4). Never installed on an appliance.
dev = [
    "detect-secrets>=1.5",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "yamllint>=1.35",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "apps",
    "apps.builder",
    "encore",
    "encore.api",
    "encore.config",
    "encore.controllers",
    "encore.domain",
    "encore.events",
    "encore.playback",
    "encore.repositories",
    "encore.search",
    "encore.services",
    "encore.utilities",
]

[tool.setuptools.package-data]
encore = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = [
    "A",    # builtins shadowing
    "ANN",  # type annotations everywhere (AIG 17)
    "ARG",  # unused arguments
    "ASYNC",# async correctness
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FA",   # future annotations
    "I",    # import sorting
    "ICN",  # conventional imports
    "LOG",  # logging best practices
    "N",    # naming (SAPRS 15.6)
    "PERF", # loop anti-patterns
    "PGH",  # blanket pragma avoidance
    "PIE",  # misc simplifications
    "PL",   # pylint subset
    "PT",   # pytest style
    "PTH",  # pathlib over os.path (SAPRS 15.5)
    "RET",  # early returns (AIG 9)
    "RSE",  # raise style
    "RUF",  # ruff specific
    "S",    # bandit-style security checks
    "SIM",  # simplifications
    "T20",  # no print
    "TRY",  # exception handling (AIG 15)
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "ANN401", # Any is permitted at IPC/JSON boundaries
    "E501",   # line length is owned by the formatter
    "PLR0913",
    "TRY003", # long messages outside the exception are acceptable here
    "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001", # fixtures and test parameters stay unannotated where pytest prefers it
    "ANN201",
    "ARG001",
    "PLR2004",# spec numbers (15,000 songs, 40 guests) belong in the assertion
    "S101",   # assert is the test language
    "S105",   # dummy credentials in tests
    "S108",   # /tmp paths are what a filesystem test wants, and tmp_path is not always enough
    "S608",   # tests assemble SQL against contract names to prove the contract; the
              # interpolation is never user-supplied, which is the point of the check
    "PLC0415",# a test that imports inside a function is importing for the failure case
    "T201",   # the performance suite prints its measurements
]
"tests/support/**" = ["S608"]
"tools/**" = [
    "INP001",
    "PLR2004",
    "S603",   # these scripts shell out to the GitHub CLI by design
    "S607",
    "T201",   # a CLI's output channel is stdout
]
"scripts/**" = ["INP001"]
"apps/builder/main.py" = [
    "T201", # a CLI's output channel is stdout, and this is the Builder's CLI
]
"apps/builder/**" = [
    "PLC0415", # an offline build imports its optional collaborators where they are used
]

[tool.ruff.lint.pep8-naming]
# The column-name namespaces in `contract.py` are interpolated into SQL dozens of times
# per query; `SC.title`, `AR.name` is what keeps a 40-line SELECT readable, and the
# alternative — `SongColumn.title` on every line — is worse for the reader, not better.
ignore-names = ["AC", "AR", "AW", "FC", "SC", "RT", "LT", "MC"]

[tool.ruff.lint.isort]
known-first-party = ["encore", "apps", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
files = ["encore", "apps", "tests", "tools"]
exclude = ["^\\.venv/", "^docs/", "^scripts/"]

[[tool.mypy.overrides]]
# mutagen ships a `py.typed` marker but annotates almost nothing: every frame class is
# `Any` at the call site. `disallow_untyped_calls` would otherwise be satisfied only by
# wrapping all of mutagen in a second, thinner library, so the rule is switched off for
# mutagen alone - and the code that depends on it (the Builder's probe, the synthetic
# media generator) is the code covered by the corpus tests.
module = ["mutagen.*", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=encore",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: fast, isolated tests (no mpv, no network, no audio hardware)",
    "integration: tests across collaborating services",
    "regression: permanent guards for previously fixed defects (SAPRS 14.14)",
    "performance: latency and throughput targets (SAPRS 1.8)",
    "party_simulation: multi-guest simulated party workloads (SAPRS 14.11)",
    "e2e: full-stack tests driving HTTP, SSE and playback",
    "slow: excluded from the fast default run",
    "chaos: fault-injection tests (SAPRS 14.13)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["encore"]
branch = true
relative_files = true

[tool.coverage.report]
# SAPRS 14.16 sets the long-term floor at 90% overall. The bootstrap phase
# contains no application logic, so the gate starts at zero and is raised in
# step with implementation milestones (tracked in docs/Developer/Testing.md).
fail_under = 0
precision = 1
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"
