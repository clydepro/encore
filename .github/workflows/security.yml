name: Security

# PBK 6 "Security": CodeQL, dependency vulnerability scan, secret scanning.
# Code scanning must be enabled on the repository before the SARIF upload can
# succeed — see docs/Developer/Repository-Administration.md for the one-command
# setup.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "17 04 * * 1"  # Mondays, vulnerability data refreshes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Security / codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    # Code scanning *default setup* must stay disabled for this repository:
    # GitHub rejects SARIF from "advanced configuration" workflows while the
    # default setup is on ("CodeQL analyses from advanced configurations cannot
    # be processed when the default setup is enabled"), and this workflow is the
    # declarative, version-pinned owner of the analysis. `scripts/setup-github-repo.sh`
    # enforces it.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python needs no build; the Actions analysis reads the workflows.
          - language: python
            build-mode: none
          - language: actions
            build-mode: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Security / dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-title: "Dependency changes (SAPRS 15.10)"

  vulnerabilities:
    name: Security / vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Audit locked dependencies against OSV
        run: uv audit --frozen

  secrets:
    name: Security / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: detect-secrets against the committed baseline
        run: >
          uv run pre-commit run detect-secrets --all-files
          --show-diff-on-failure
