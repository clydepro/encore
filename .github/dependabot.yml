# PBK 7 / PBK 10: dependency automation.
# Encore's dependency policy (SAPRS 15.10, AEP 10) is "minimal, maintained,
# justified, reproducible": bumps arrive as reviewable PRs, never silently.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - chore
      - "area:testing"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "05:15"
      timezone: America/New_York
    open-pull-requests-limit: 8
    allow:
      - dependency-type: direct
    # Major jumps are reviewed individually; minors and patches are grouped.
    labels:
      - chore
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
