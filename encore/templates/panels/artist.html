{# An artist's albums and tracks, as a fragment. #}
{% if albums %}<h2>Albums</h2><ul class="card-list">{% for album in albums %}<li class="card"><a href="/albums/{{ album.id }}"><img src="/artwork/album/{{ album.id }}" alt="" width="72" height="72" loading="lazy"><span>{{ album.title }}</span></a></li>{% endfor %}</ul>{% endif %}
{% if tracks %}<h2>Tracks</h2><ul class="row-list">{% for row in tracks %}<li>{% include "partials/song_row.html" %}</li>{% endfor %}</ul>{% endif %}
