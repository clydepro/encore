# Example installation-time configuration (SAPRS Chapter 12).
#
# Copy to /etc/encore/config.yaml during installation and adjust. This file is
# NOT managed state: Encore reads it at startup, validates it, and never writes
# it back. The administrative interface may display it read-only (SAPRS 12.3).
#
# Values below are documentation of the shape the Configuration Service will
# validate in milestone 4; the schema itself is implemented there, not here.

server:
  # Bind address for the guest/admin web interface.
  host: 0.0.0.0
  port: 8080
  # mDNS hostname advertised to guests (SAPRS 1.4).
  hostname: jukebox
  domain: jukebox.home.arpa

paths:
  # Read-only, published by the Library Builder (ADR-006).
  library_db: /var/lib/encore/library.db
  # Read/write queue, history and statistics (SAPRS 5.7).
  runtime_db: /var/lib/encore/runtime.db
  # Artwork cache produced by the Builder (SAPRS 5.6).
  artwork_dir: /var/lib/encore/artwork
  # Scratch space for atomic publication.
  temp_dir: /var/cache/encore/temp
  # Library location (SAPRS 12.2). Read by the Library Builder only; the server
  # never scans the filesystem (ADR-010). User music lives under /opt.
  music_dir: /opt/music

audio:
  # mpv output selection; hardware specifics never live in code (SAPRS 7.7).
  output: alsa
  device: default
  volume: 85
  gapless: true
  crossfade_seconds: 0.0

queue:
  max_items: 200
  allow_duplicates: true

playback:
  mpv_path: /usr/bin/mpv
  restart_backoff_seconds: [1, 2, 5, 10, 30]
  progress_interval_seconds: 1.0

search:
  page_size: 50

logging:
  level: INFO
  format: json

admin:
  # Sessions expire; the secret comes from the environment or system store,
  # never from this file (SAPRS 12.6).
  session_minutes: 60
